[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twinguard"
version = "1.0.0"
description = "Reliability-aware revalidation and selective certification for degraded digital twins"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Lower bounds are those declared by the development repository. Exact versions used to
# produce the frozen results were not recorded; see reproducibility/README.md.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["twinguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
